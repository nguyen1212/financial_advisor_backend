name: CI/CD for Go Application

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: podron/financial-advisor
  CONTAINER_NAME: financial-advisor-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.server -t ${{ env.DOCKER_IMAGE }}:latest --platform="linux/amd64" . |

      - name: Push Docker Image to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Install Docker if not exists
            if ! command -v docker &> /dev/null; then
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ec2-user
              sudo newgrp docker
            fi

            # Install Nginx if not exists
            if ! command -v nginx &> /dev/null; then
              sudo dnf install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # Configure Nginx
            # sudo tee /etc/nginx/conf.d/go-app.conf << 'EOL'
            # server {
            #     listen 80;
            #     server_name _;
            #
            #     location / {
            #         proxy_pass http://localhost:8080;
            #         proxy_http_version 1.1;
            #         proxy_set_header Upgrade $http_upgrade;
            #         proxy_set_header Connection 'upgrade';
            #         proxy_set_header Host $host;
            #         proxy_cache_bypass $http_upgrade;
            #         proxy_set_header X-Real-IP $remote_addr;
            #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            #     }
            # }
            # EOL

            # Test Nginx config
            # sudo nginx -t

            # Reload Nginx
            # sudo systemctl reload nginx

            # Pull latest image
            sudo docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Stop and remove old container
            sudo docker stop ${{ env.CONTAINER_NAME }} || true
            sudo docker rm ${{ env.CONTAINER_NAME }} || true

            # Run new container
            sudo docker run -d --name ${{ env.CONTAINER_NAME }} \
              -p ${{ secrets.HTTP_PORT }}:${{ secrets.HTTP_PORT }} \
              -e ENV=${{ secrets.ENV }}\
              -e HTTP_PORT=${{ secrets.HTTP_PORT }} \
              -e LOG_LEVEL=${{ secrets.LOG_LEVEL }} \
              -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
              -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              -e MYSQL_HOST=${{ secrets.MYSQL_HOST }} \
              -e MYSQL_PORT=${{ secrets.MYSQL_PORT }} \
              -e MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} \
              --restart unless-stopped \
              -d ${{ env.DOCKER_IMAGE }}:latest


            # Clean up old images
            sudo docker image prune -f
